# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# goreleaser builds the server as archives, so that a laptop or a runner can
# hold the same binary the cluster does, and, through ko, the one image the
# chart deploys. The chart itself is packaged at the tag's version and pushed
# to oci://ghcr.io/truvity/charts/ci-cache-server.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@822f94031ee2c91b76da8d5071bfb3d1b6af27b7 # v3.19.0
    with:
      # `ci-cache-server`, not `ci-cache`: that registry path already holds
      # another chart's 1.x line, which a 0.x release would sort below.
      charts: '["ci-cache-server"]'
      # The server as a Nix flake, one release asset, so that a runner image
      # or another repository's devbox can pin this binary by hash. The tiers
      # are one program: the cache a developer runs over a bucket is the same
      # binary the cluster runs, and a pin is how it stays the same one.
      nix-flakes: '["ci-cache"]'
      # The image's full name: .goreleaser.yaml builds it `bare`, so ko
      # appends nothing. It is what the chart's `image.repository` names, and
      # this value, NOT the `repositories:` list in .goreleaser.yaml, is what
      # ko obeys. An image name never repeats the repository's: it was
      # ci-cache/ci-cache up to v0.2.0.
      ko-docker-repo: ghcr.io/truvity/ci-cache/server
