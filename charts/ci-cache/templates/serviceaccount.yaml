{{- if .Values.serviceAccount.create }}
# The identity that reads and writes the bucket, and nothing else. On a store
# with pod identity this is where the binding goes; with static keys it stays
# bare and `store.existingSecret` carries them. Both at once is refused.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ci-cache.serviceAccountName" . }}
  labels:
    {{- include "ci-cache.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
